# =============================================================================
# Enterprise Tagging Framework - Canonical Tag Catalog
# =============================================================================
# Aligned to: "FinOps Tagging Strategy - Allocation Hierarchy"
#             (Enterprise Observability & FinOps Architecture)
#
# This file is the SINGLE SOURCE OF TRUTH for the enterprise tag taxonomy.
#
#   config/tag_catalog.yaml
#        |-- scripts/validate_catalog.py   -> schema + policy validation (CI gate)
#        |-- scripts/generate_sql.py       -> sql/_generated/*.sql  (tag DDL, seeds)
#        |-- scripts/generate_docs.py      -> docs/reference/*.md   (matrices)
#        `-- scripts/generate_tfvars.py    -> terraform/*.auto.tfvars.json
#
# NOTHING downstream is hand-edited. Change the taxonomy here, run `make build`,
# commit the regenerated artifacts. CI fails if generated output is stale.
#
# ---------------------------------------------------------------------------
# NAMING - READ THIS FIRST
# ---------------------------------------------------------------------------
# Canonical tag keys are lowercase snake_case, matching the enterprise standard
# and AWS tag keys, which ARE case-sensitive.
#
# Snowflake folds unquoted identifiers to upper case, so `operating_company`
# becomes OPERATING_COMPANY once created. That is the correct behaviour to lean
# on: quoting lowercase identifiers in Snowflake would force every downstream
# query, policy body and ACCOUNT_USAGE join to quote them forever.
#
# So each tag has two names, and the generators pick the right one per platform:
#   name             lowercase canonical - AWS, Denodo, Collibra, documentation
#   <name>.upper()   Snowflake identifier and everything read back from
#                    ACCOUNT_USAGE.TAG_REFERENCES
#
# ---------------------------------------------------------------------------
# FIELD REFERENCE
# ---------------------------------------------------------------------------
#   name           Canonical tag key (lowercase snake_case, <=64 chars).
#   tier           1 = Core Mandatory | 2 = Governance | 3 = Optional/Domain.
#   level          The allocation-hierarchy level this tag expresses.
#   hierarchy_requirement
#                  Tier 1 only. MANDATORY | RECOMMENDED - mirrors the "Mandatory"
#                  column of the published FinOps Tagging Strategy, so the slide
#                  and this catalog cannot drift apart.
#   category       Taxonomy grouping (business, ownership, classification, ...).
#   description    Business definition. Becomes the Snowflake tag COMMENT.
#   platforms      Platforms on which this tag is applied and enforced.
#   value_source   controlled_vocabulary | reference_data | free_text
#                    controlled_vocabulary -> ALLOWED_VALUES enforced by Snowflake
#                    reference_data        -> validated against a control table
#                                             (too volatile/large for ALLOWED_VALUES)
#                    free_text             -> format-validated only
#   allowed_values Required when value_source = controlled_vocabulary.
#   value_format   Regex applied by the validation procedure (all value_sources).
#   reference_table Control-plane table holding the authoritative value list.
#   ordinal_values Ordered (least -> most severe) list used for "most restrictive
#                  wins" inheritance conflict resolution.
#   applies_to     Object types on which the tag may be SET (assignment surface).
#   requirement    Per object type: MANDATORY | RECOMMENDED | OPTIONAL | INHERITED
#                    INHERITED = satisfied by an ancestor; direct SET is an
#                                override, allowed only per override_rule.
#   inheritance    inherit | explicit_only
#   override_rule  none | more_restrictive_only | any
#   drives         Downstream capabilities that consume this tag. Anything not
#                  consumed by at least one capability is a candidate for
#                  retirement (see docs/09-anti-patterns.md).
#   owner_role     Accountable enterprise role for the tag definition.
#   version        SemVer of the tag DEFINITION (not of its values).
#   status         ACTIVE | DEPRECATED | RETIRED
# =============================================================================

metadata:
  framework_version: "2.0.0"
  catalog_version: "2.0.0"
  effective_date: "2026-01-01"
  aligned_to: "FinOps Tagging Strategy - Allocation Hierarchy"
  review_cadence: "Quarterly (Data Governance Council)"
  owner: "Enterprise Data Governance Office (EDGO)"
  snowflake_edition_required: "Enterprise Edition or higher (object tagging)"

# ---------------------------------------------------------------------------
# PLATFORMS
# ---------------------------------------------------------------------------
# The same tag keys are applied at every resource across the estate. Each
# platform enforces them differently, and the differences are load-bearing:
# a tag key that is case-sensitive on AWS and case-folding on Snowflake will
# silently produce two allocation buckets if that is not handled deliberately.
# ---------------------------------------------------------------------------
platforms:
  - id: AWS
    identifier_case: preserve          # AWS tag keys are case-SENSITIVE
    max_key_length: 128
    max_value_length: 256
    enforcement: >-
      Service Control Policies with aws:RequestTag / aws:TagKeys conditions deny
      resource creation without the mandatory keys; Config rules flag drift.
  - id: SNOWFLAKE
    identifier_case: upper             # unquoted identifiers fold to UPPER CASE
    max_key_length: 255
    max_value_length: 256
    enforcement: >-
      Object tags with ALLOWED_VALUES, SP_APPLY_TAG for reference-data and
      free-text validation, tag-based masking policies, nightly drift scan.
  - id: DENODO
    identifier_case: preserve
    max_key_length: 128
    max_value_length: 256
    enforcement: >-
      View and datasource custom properties populated from the same registry;
      validated by the pre-deploy linter, not by the platform itself.
  - id: COLLIBRA
    identifier_case: preserve
    max_key_length: 255
    max_value_length: 256
    enforcement: >-
      Attribute types on assets, synchronised from the tag registry so the
      catalogue and the platforms cannot disagree about a value's validity.

# ---------------------------------------------------------------------------
# Deployment topology. Referenced by every generator.
# ---------------------------------------------------------------------------
deployment:
  governance_database: GOVERNANCE
  tag_schema: TAGS                 # tag objects live here, and ONLY here
  policy_schema: POLICIES          # masking / row access policies
  control_schema: CONTROL          # control-plane tables, registries, exceptions
  reporting_schema: REPORTING      # governance + FinOps views
  automation_schema: AUTOMATION    # procedures, tasks, streams, alerts
  warehouse: GOVERNANCE_WH
  roles:
    admin: TAG_ADMIN               # owns tags + policies; may CREATE/ALTER/DROP
    steward: TAG_STEWARD           # may APPLY tags within owned domains
    reader: TAG_READER             # read-only on governance reporting
    finops: FINOPS_ANALYST         # read-only on FinOps reporting
    auditor: COMPLIANCE_AUDITOR    # read-only on compliance evidence views

# ---------------------------------------------------------------------------
# Object-type surface. `matrix_columns` drives the published Mandatory/Optional
# matrix; `all` is the full assignment surface the validators police.
# ---------------------------------------------------------------------------
object_types:
  matrix_columns: [DATABASE, SCHEMA, TABLE, VIEW, COLUMN, WAREHOUSE]
  all:
    - ACCOUNT
    - DATABASE
    - SCHEMA
    - TABLE
    - VIEW
    - MATERIALIZED_VIEW
    - DYNAMIC_TABLE
    - EXTERNAL_TABLE
    - ICEBERG_TABLE
    - COLUMN
    - STAGE
    - PIPE
    - TASK
    - STREAM
    - FUNCTION
    - PROCEDURE
    - WAREHOUSE
    - ROLE
    - USER
    - INTEGRATION
    - SHARE
    - NOTEBOOK
    - STREAMLIT
    - APPLICATION

# ---------------------------------------------------------------------------
# Snowflake platform limits the framework is engineered against.
# Asserted in CI so a taxonomy change can never silently breach a hard ceiling.
# ---------------------------------------------------------------------------
platform_limits:
  max_tags_per_object: 50
  max_unique_tag_keys_per_account: 10000
  max_tag_value_length: 256
  max_allowed_values_per_tag: 300
  # Framework-imposed budget, deliberately far below the platform ceiling.
  max_tags_directly_set_per_object_target: 12

# ---------------------------------------------------------------------------
# Reusable value-format patterns (referenced by name from `value_format`).
# ---------------------------------------------------------------------------
value_formats:
  email: '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$'
  # An SSO email, or an explicitly-named service account. Nothing else: an
  # ownership tag whose value is a team nickname routes no incident anywhere.
  owner_principal: '^(?:[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}|service-account-[a-z0-9][a-z0-9-]{1,48})$'
  group_principal: '^(?:[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}|GRP-[A-Z0-9-]{3,48})$'
  code_upper: '^[A-Z0-9][A-Z0-9_]{1,62}$'
  team_slug: '^team-[a-z0-9][a-z0-9-]{1,48}$'
  application_slug: '^app-[a-z0-9][a-z0-9-]{1,48}$'
  opco_code: '^(?:OPCO_[A-Z0-9_]{2,48}|SHARED)$'
  cost_center: '^CC-[0-9]{4,8}$'
  project_code: '^(PRJ|PRG)-[A-Z0-9]{2,4}-[0-9]{3,6}$'
  duration_iso: '^PT(?:[0-9]{1,3}H)?(?:[0-9]{1,3}M)?$|^P[0-9]{1,3}D$'

# =============================================================================
# TIER 1 - CORE ALLOCATION HIERARCHY
# -----------------------------------------------------------------------------
# These are the tags named in the enterprise FinOps Tagging Strategy. They are
# applied at EVERY resource across AWS, Snowflake, Denodo and Collibra, and
# untagged production resources are blocked at CI/CD.
#
# The hierarchy reads top-down:
#   operating_company -> department -> domain -> team -> application
#                     -> workload_type -> owner_user
# with environment and the two classification tags applied alongside.
# =============================================================================
tags:

  - name: operating_company
    tier: 1
    hierarchy_requirement: MANDATORY
    level: Operating Company
    category: business
    description: >-
      Top-level legal and financial entity for chargeback and consolidation.
      The consolidation boundary for every cost report and the outermost
      jurisdiction boundary for data residency.
    platforms: [AWS, SNOWFLAKE, DENODO, COLLIBRA]
    value_source: controlled_vocabulary
    allowed_values:
      - OPCO_AEP_OHIO
      - OPCO_AEP_TEXAS
      - OPCO_APPALACHIAN
      - OPCO_AEP_INDIANA_MICHIGAN
      - OPCO_KENTUCKY_POWER
      - OPCO_PSC_OKLAHOMA
      - OPCO_SEPC
      - SHARED
    value_format: opco_code
    applies_to: [ACCOUNT, DATABASE, SCHEMA, TABLE, VIEW, MATERIALIZED_VIEW, DYNAMIC_TABLE, ICEBERG_TABLE, WAREHOUSE, STAGE, PIPE, TASK, STREAM, ROLE, USER, SHARE, NOTEBOOK, STREAMLIT, APPLICATION]
    default_requirement: INHERITED
    requirement:
      DATABASE: MANDATORY
      WAREHOUSE: MANDATORY
      ROLE: RECOMMENDED
      COLUMN: NOT_APPLICABLE
    inheritance: inherit
    override_rule: any
    drives: [finops_chargeback, finops_consolidation, access_boundary, residency_control, discovery]
    owner_role: FINANCE_FINOPS
    version: "1.0.0"
    status: ACTIVE

  - name: department
    tier: 1
    hierarchy_requirement: MANDATORY
    level: Department
    category: business
    description: >-
      Business unit or cost centre within the operating company. The level at
      which departmental cost reports are produced and budgets are owned.
    platforms: [AWS, SNOWFLAKE, DENODO, COLLIBRA]
    value_source: controlled_vocabulary
    allowed_values:
      - FINANCE
      - HR
      - MARKETING
      - DISTRIBUTION
      - GENERATION
      - COMOPS
      - GIS
      - CORPORATE
      - CUSTOMER
      - SHARED_SERVICES
    applies_to: [DATABASE, SCHEMA, TABLE, VIEW, MATERIALIZED_VIEW, DYNAMIC_TABLE, ICEBERG_TABLE, WAREHOUSE, STAGE, PIPE, TASK, STREAM, ROLE, NOTEBOOK, STREAMLIT, APPLICATION]
    default_requirement: INHERITED
    requirement:
      DATABASE: MANDATORY
      WAREHOUSE: MANDATORY
      COLUMN: NOT_APPLICABLE
    inheritance: inherit
    override_rule: any
    drives: [finops_chargeback, department_reporting, budget_enforcement, discovery]
    owner_role: FINANCE_FINOPS
    version: "1.0.0"
    status: ACTIVE

  - name: domain
    tier: 1
    hierarchy_requirement: MANDATORY
    level: Data Domain
    category: business
    description: >-
      Logical data domain owning the workload, mesh-style. The unit of federated
      governance and of data-product publication. Independent of department:
      one domain routinely serves several departments.
    platforms: [AWS, SNOWFLAKE, DENODO, COLLIBRA]
    value_source: controlled_vocabulary
    allowed_values:
      - CUSTOMER
      - LOCATION
      - METER
      - FINANCE
      - SUPPLY_CHAIN
      - MARKETING
      - RISK
      - TELEMETRY
    applies_to: [DATABASE, SCHEMA, TABLE, VIEW, MATERIALIZED_VIEW, DYNAMIC_TABLE, ICEBERG_TABLE, STAGE, PIPE, TASK, STREAM, WAREHOUSE, SHARE, NOTEBOOK, STREAMLIT, APPLICATION]
    default_requirement: INHERITED
    requirement:
      DATABASE: MANDATORY
      SCHEMA: MANDATORY
      COLUMN: NOT_APPLICABLE
    inheritance: inherit
    override_rule: any
    drives: [data_mesh, federated_governance, discovery, finops_showback, row_access_policy]
    owner_role: EDGO
    version: "1.0.0"
    status: ACTIVE

  - name: team
    tier: 1
    hierarchy_requirement: MANDATORY
    level: Team
    category: ownership
    description: >-
      Engineering team accountable for build and run. Validated against the team
      registry so a disbanded team cannot keep owning production workloads.
    platforms: [AWS, SNOWFLAKE, DENODO, COLLIBRA]
    value_source: reference_data
    reference_table: REF_TEAM
    value_format: team_slug
    applies_to: [DATABASE, SCHEMA, TABLE, VIEW, MATERIALIZED_VIEW, DYNAMIC_TABLE, ICEBERG_TABLE, STAGE, PIPE, TASK, STREAM, WAREHOUSE, FUNCTION, PROCEDURE, NOTEBOOK, STREAMLIT, APPLICATION]
    default_requirement: INHERITED
    requirement:
      DATABASE: MANDATORY
      SCHEMA: MANDATORY
      WAREHOUSE: MANDATORY
      TASK: MANDATORY
      PIPE: MANDATORY
      COLUMN: NOT_APPLICABLE
    inheritance: inherit
    override_rule: any
    drives: [incident_routing, stewardship_workflow, finops_showback, operational_reporting]
    owner_role: PLATFORM_ENGINEERING
    version: "1.0.0"
    status: ACTIVE

  - name: application
    tier: 1
    hierarchy_requirement: MANDATORY
    level: Application
    category: business
    description: >-
      Discrete application or data product, aligned to the CMDB. The join key
      between Snowflake objects and the enterprise application portfolio, which
      is what makes cross-platform impact analysis possible at all.
    platforms: [AWS, SNOWFLAKE, DENODO, COLLIBRA]
    value_source: reference_data
    reference_table: REF_APPLICATION
    value_format: application_slug
    applies_to: [DATABASE, SCHEMA, TABLE, VIEW, MATERIALIZED_VIEW, DYNAMIC_TABLE, ICEBERG_TABLE, STAGE, PIPE, TASK, STREAM, WAREHOUSE, INTEGRATION, SHARE, NOTEBOOK, STREAMLIT, APPLICATION]
    default_requirement: INHERITED
    requirement:
      SCHEMA: MANDATORY
      WAREHOUSE: MANDATORY
      PIPE: MANDATORY
      TASK: MANDATORY
      COLUMN: NOT_APPLICABLE
    inheritance: inherit
    override_rule: any
    drives: [cmdb_reconciliation, impact_analysis, finops_chargeback, discovery, incident_routing]
    owner_role: ENTERPRISE_ARCHITECTURE
    version: "1.0.0"
    status: ACTIVE

  - name: workload_type
    tier: 1
    hierarchy_requirement: MANDATORY
    level: Role / Workload Class
    category: operational
    description: >-
      Workload class, for resource-pattern rollups. Lets FinOps compare like with
      like across the estate - ML training spend against ML training spend, not
      against BI - and drives right-sizing recommendations per pattern.
    platforms: [AWS, SNOWFLAKE, DENODO]
    value_source: controlled_vocabulary
    allowed_values:
      - INGEST
      - TRANSFORM
      - ANALYTICS
      - ML_TRAIN
      - ML_SERVE
      - BI
      - GOVERNANCE
      - PLATFORM_OPS
    applies_to: [SCHEMA, TABLE, VIEW, MATERIALIZED_VIEW, DYNAMIC_TABLE, STAGE, PIPE, TASK, STREAM, WAREHOUSE, FUNCTION, PROCEDURE, NOTEBOOK, STREAMLIT]
    default_requirement: INHERITED
    requirement:
      WAREHOUSE: MANDATORY
      TASK: MANDATORY
      PIPE: MANDATORY
      SCHEMA: RECOMMENDED
      COLUMN: NOT_APPLICABLE
    inheritance: inherit
    override_rule: any
    drives: [finops_rightsizing, workload_analytics, capacity_planning, finops_showback]
    owner_role: PLATFORM_ENGINEERING
    version: "1.0.0"
    status: ACTIVE

  - name: owner_user
    tier: 1
    hierarchy_requirement: RECOMMENDED
    level: Owner / User
    category: ownership
    description: >-
      Accountable individual by SSO email, or the named service account that owns
      an automated workload. Recommended rather than mandatory: an owner tag that
      is mandated before joiner-mover-leaver feeds are wired up fills with stale
      names, which is worse than an honest blank.
    platforms: [AWS, SNOWFLAKE, DENODO, COLLIBRA]
    value_source: free_text
    value_format: owner_principal
    applies_to: [ACCOUNT, DATABASE, SCHEMA, TABLE, VIEW, MATERIALIZED_VIEW, DYNAMIC_TABLE, ICEBERG_TABLE, STAGE, PIPE, TASK, STREAM, WAREHOUSE, ROLE, USER, INTEGRATION, SHARE, NOTEBOOK, STREAMLIT, APPLICATION]
    default_requirement: OPTIONAL
    requirement:
      DATABASE: RECOMMENDED
      SCHEMA: RECOMMENDED
      WAREHOUSE: RECOMMENDED
      COLUMN: NOT_APPLICABLE
    inheritance: inherit
    override_rule: any
    drives: [incident_routing, access_approval, attestation, finops_accountability]
    owner_role: EDGO
    version: "1.0.0"
    status: ACTIVE

  - name: environment
    tier: 1
    hierarchy_requirement: MANDATORY
    level: Environment
    category: lifecycle
    description: >-
      Lifecycle stage, required alongside the core tags. Never inherited across a
      clone into a different environment - the clone-remediation job rewrites it.
    platforms: [AWS, SNOWFLAKE, DENODO, COLLIBRA]
    value_source: controlled_vocabulary
    allowed_values:
      - PRD
      - UAT
      - TST
      - DEV
      - TRAINING
      - BACKUP
    applies_to: [ACCOUNT, DATABASE, SCHEMA, WAREHOUSE, STAGE, PIPE, TASK, STREAM, ROLE, INTEGRATION, NOTEBOOK, STREAMLIT, APPLICATION]
    default_requirement: INHERITED
    requirement:
      DATABASE: MANDATORY
      WAREHOUSE: MANDATORY
      COLUMN: NOT_APPLICABLE
    inheritance: inherit
    override_rule: none
    drives: [policy_selection, promotion_gate, finops_chargeback, masking_strictness, nonprod_waste_analysis]
    owner_role: PLATFORM_ENGINEERING
    version: "1.0.0"
    status: ACTIVE

  - name: data_classification_enterprise
    tier: 1
    hierarchy_requirement: MANDATORY
    level: Data Classification
    category: classification
    description: >-
      Core enterprise confidentiality classification. The only tag carrying
      masking policy attachments, so it is the anchor of the whole protection
      model. Most restrictive value in the lineage wins.
    platforms: [AWS, SNOWFLAKE, DENODO, COLLIBRA]
    value_source: controlled_vocabulary
    allowed_values: [NONE, PUBLIC, INTERNAL, CONFIDENTIAL, RESTRICTED]
    # NONE ranks LOWEST, and it means "assessed, no classification applies".
    # An ABSENT tag is a different thing entirely and fails closed to RESTRICTED
    # in the masking policies - see docs/05.
    ordinal_values: [NONE, PUBLIC, INTERNAL, CONFIDENTIAL, RESTRICTED]
    applies_to: [ACCOUNT, DATABASE, SCHEMA, TABLE, VIEW, MATERIALIZED_VIEW, DYNAMIC_TABLE, EXTERNAL_TABLE, ICEBERG_TABLE, COLUMN, STAGE, SHARE, NOTEBOOK, STREAMLIT]
    default_requirement: INHERITED
    requirement:
      DATABASE: MANDATORY
      SCHEMA: MANDATORY
      TABLE: MANDATORY
      VIEW: MANDATORY
      COLUMN: RECOMMENDED
      STAGE: MANDATORY
      SHARE: MANDATORY
    inheritance: inherit
    override_rule: more_restrictive_only
    drives: [dynamic_masking, sharing_control, export_control, compliance_reporting, discovery]
    owner_role: CISO_DATA_SECURITY
    version: "1.0.0"
    status: ACTIVE

  - name: data_classification_regulatory
    tier: 1
    hierarchy_requirement: MANDATORY
    level: Data Classification
    category: privacy
    description: >-
      Regulatory-driven data classification. Holds the GOVERNING category - the
      one whose technical controls are most prescriptive - resolved by documented
      precedence. Where several categories apply, the full set is recorded in
      CONTROL.REGULATORY_SCOPE, because a Snowflake tag holds only one value.
    platforms: [AWS, SNOWFLAKE, DENODO, COLLIBRA]
    value_source: controlled_vocabulary
    allowed_values: [NONE, PII, SPII, PHI, PCI]
    # Ordered by how prescriptive the mandated technical control is, not by
    # penalty size: PCI-DSS dictates specific handling of specific fields, PII
    # under a privacy regime mandates outcomes and leaves the mechanism open.
    ordinal_values: [NONE, PII, SPII, PHI, PCI]
    applies_to: [DATABASE, SCHEMA, TABLE, VIEW, MATERIALIZED_VIEW, DYNAMIC_TABLE, EXTERNAL_TABLE, ICEBERG_TABLE, COLUMN, STAGE, SHARE]
    default_requirement: INHERITED
    requirement:
      SCHEMA: MANDATORY
      TABLE: MANDATORY
      VIEW: MANDATORY
      COLUMN: MANDATORY
      STAGE: MANDATORY
      SHARE: MANDATORY
    inheritance: inherit
    override_rule: more_restrictive_only
    drives: [dynamic_masking, privacy_reporting, dsar_fulfilment, audit_evidence, auto_classification, pci_scoping]
    owner_role: PRIVACY_OFFICE
    version: "1.0.0"
    status: ACTIVE

# =============================================================================
# TIER 2 - GOVERNANCE TAGS
# -----------------------------------------------------------------------------
# Not part of the published allocation hierarchy, but each one is consumed by an
# automated control that the hierarchy alone cannot drive: retention and purge,
# incident routing, row-level access, DR tiering, evidence for an assessor.
# Mandatory only where a condition holds (see conditional_rules).
# =============================================================================

  - name: data_product
    tier: 2
    level: Data Product
    category: business
    description: >-
      Named, versioned, independently consumable data product. Maps 1:1 to a
      schema, which is the publication boundary. Distinct from `application`:
      one application can publish several data products.
    platforms: [SNOWFLAKE, DENODO, COLLIBRA]
    value_source: reference_data
    reference_table: REF_DATA_PRODUCT
    value_format: '^dp-[a-z0-9][a-z0-9-]{2,48}$'
    applies_to: [SCHEMA, TABLE, VIEW, MATERIALIZED_VIEW, DYNAMIC_TABLE, ICEBERG_TABLE, STAGE, PIPE, TASK, STREAM, SHARE, NOTEBOOK, STREAMLIT]
    default_requirement: INHERITED
    requirement:
      SCHEMA: RECOMMENDED
      SHARE: MANDATORY
      COLUMN: NOT_APPLICABLE
      DATABASE: NOT_APPLICABLE
    inheritance: inherit
    override_rule: none
    drives: [data_mesh, discovery, lineage, sla_management, consumer_contract]
    owner_role: DOMAIN_COUNCIL
    version: "1.0.0"
    status: ACTIVE

  - name: data_owner
    tier: 2
    level: Ownership
    category: ownership
    description: >-
      Accountable business owner (RACI 'A') for the DATA, as distinct from
      owner_user who is accountable for the RESOURCE. Approves access,
      classification and retention decisions.
    platforms: [SNOWFLAKE, DENODO, COLLIBRA]
    value_source: free_text
    value_format: group_principal
    applies_to: [DATABASE, SCHEMA, TABLE, VIEW, MATERIALIZED_VIEW, DYNAMIC_TABLE, ICEBERG_TABLE, STAGE, SHARE, APPLICATION]
    default_requirement: INHERITED
    requirement:
      SCHEMA: RECOMMENDED
      SHARE: MANDATORY
      COLUMN: NOT_APPLICABLE
    inheritance: inherit
    override_rule: any
    drives: [access_approval, attestation, remediation_routing, audit_evidence]
    owner_role: EDGO
    version: "1.0.0"
    status: ACTIVE

  - name: data_steward
    tier: 2
    level: Ownership
    category: ownership
    description: >-
      Responsible steward (RACI 'R') executing day-to-day governance: tagging,
      classification review, quality remediation, metadata curation.
    platforms: [SNOWFLAKE, COLLIBRA]
    value_source: free_text
    value_format: group_principal
    applies_to: [DATABASE, SCHEMA, TABLE, VIEW, MATERIALIZED_VIEW, DYNAMIC_TABLE, ICEBERG_TABLE, STAGE]
    default_requirement: INHERITED
    requirement:
      SCHEMA: RECOMMENDED
      COLUMN: NOT_APPLICABLE
    inheritance: inherit
    override_rule: any
    drives: [stewardship_workflow, attestation, remediation_routing]
    owner_role: EDGO
    version: "1.0.0"
    status: ACTIVE

  - name: support_group
    tier: 2
    level: Ownership
    category: ownership
    description: >-
      ITSM queue that owns break/fix. Complements `team`, which names the
      accountable engineers; support_group names where the ticket actually lands
      out of hours.
    platforms: [AWS, SNOWFLAKE, DENODO]
