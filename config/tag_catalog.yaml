# =============================================================================
# Enterprise Snowflake Tagging Framework - Canonical Tag Catalog
# =============================================================================
# This file is the SINGLE SOURCE OF TRUTH for the enterprise tag taxonomy.
#
#   config/tag_catalog.yaml
#        |-- scripts/validate_catalog.py   -> schema + policy validation (CI gate)
#        |-- scripts/generate_sql.py       -> sql/_generated/*.sql  (tag DDL, seeds)
#        |-- scripts/generate_docs.py      -> docs/reference/*.md   (matrices)
#        `-- scripts/generate_tfvars.py    -> terraform/*.auto.tfvars.json
#
# NOTHING downstream is hand-edited. Change the taxonomy here, run `make build`,
# commit the regenerated artifacts. CI fails if generated output is stale.
#
# ---------------------------------------------------------------------------
# FIELD REFERENCE
# ---------------------------------------------------------------------------
#   name           Tag identifier (UPPER_SNAKE_CASE, <=64 chars, no prefix).
#   tier           1 = Core Mandatory | 2 = Governance | 3 = Optional/Domain.
#   category       Taxonomy grouping (business, ownership, classification, ...).
#   description    Business definition. Becomes the Snowflake tag COMMENT.
#   value_source   controlled_vocabulary | reference_data | free_text
#                    controlled_vocabulary -> ALLOWED_VALUES enforced by Snowflake
#                    reference_data        -> validated against a control table
#                                             (too volatile/large for ALLOWED_VALUES)
#                    free_text             -> format-validated only
#   allowed_values Required when value_source = controlled_vocabulary.
#   value_format   Regex applied by the validation procedure (all value_sources).
#   reference_table Control-plane table holding the authoritative value list.
#   ordinal_values Ordered (least -> most severe) list used for "most restrictive
#                  wins" inheritance conflict resolution.
#   applies_to     Object types on which the tag may be SET (assignment surface).
#   requirement    Per object type: MANDATORY | RECOMMENDED | OPTIONAL | INHERITED
#                    INHERITED = satisfied by an ancestor; direct SET is an
#                                override, allowed only per override_rule.
#   inheritance    inherit | explicit_only
#   override_rule  none | more_restrictive_only | any
#   drives         Downstream capabilities that consume this tag. Anything not
#                  consumed by at least one capability is a candidate for
#                  retirement (see docs/09-anti-patterns.md).
#   owner_role     Accountable enterprise role for the tag definition.
#   version        SemVer of the tag DEFINITION (not of its values).
#   status         ACTIVE | DEPRECATED | RETIRED
#   deprecates     Tag this one supersedes (drives migration tooling).
# =============================================================================

metadata:
  framework_version: "1.0.0"
  catalog_version: "1.0.0"
  effective_date: "2026-01-01"
  review_cadence: "Quarterly (Data Governance Council)"
  owner: "Enterprise Data Governance Office (EDGO)"
  snowflake_edition_required: "Enterprise Edition or higher (object tagging)"

# ---------------------------------------------------------------------------
# Deployment topology. Referenced by every generator.
# ---------------------------------------------------------------------------
deployment:
  governance_database: GOVERNANCE
  tag_schema: TAGS                 # tag objects live here, and ONLY here
  policy_schema: POLICIES          # masking / row access policies
  control_schema: CONTROL          # control-plane tables, registries, exceptions
  reporting_schema: REPORTING      # governance + FinOps views
  automation_schema: AUTOMATION    # procedures, tasks, streams, alerts
  warehouse: GOVERNANCE_WH
  roles:
    admin: TAG_ADMIN               # owns tags + policies; may CREATE/ALTER/DROP
    steward: TAG_STEWARD           # may APPLY tags within owned domains
    reader: TAG_READER             # read-only on governance reporting
    finops: FINOPS_ANALYST         # read-only on FinOps reporting
    auditor: COMPLIANCE_AUDITOR    # read-only on compliance evidence views

# ---------------------------------------------------------------------------
# Object-type surface. `matrix_columns` drives the published Mandatory/Optional
# matrix; `all` is the full assignment surface the validators police.
# ---------------------------------------------------------------------------
object_types:
  matrix_columns: [DATABASE, SCHEMA, TABLE, VIEW, COLUMN, WAREHOUSE]
  all:
    - ACCOUNT
    - DATABASE
    - SCHEMA
    - TABLE
    - VIEW
    - MATERIALIZED_VIEW
    - DYNAMIC_TABLE
    - EXTERNAL_TABLE
    - ICEBERG_TABLE
    - COLUMN
    - STAGE
    - PIPE
    - TASK
    - STREAM
    - FUNCTION
    - PROCEDURE
    - WAREHOUSE
    - ROLE
    - USER
    - INTEGRATION
    - SHARE
    - NOTEBOOK
    - STREAMLIT
    - APPLICATION

# ---------------------------------------------------------------------------
# Snowflake platform limits the framework is engineered against.
# Sourced from Snowflake object-tagging documentation; asserted in CI so a
# taxonomy change can never silently breach a hard platform ceiling.
# ---------------------------------------------------------------------------
platform_limits:
  max_tags_per_object: 50
  max_unique_tag_keys_per_account: 10000
  max_tag_value_length: 256
  max_allowed_values_per_tag: 300
  # Framework-imposed budget, deliberately far below the platform ceiling.
  max_tags_directly_set_per_object_target: 12

# ---------------------------------------------------------------------------
# Reusable value-format patterns (referenced as `value_format: &ref` names).
# ---------------------------------------------------------------------------
value_formats:
  email: '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$'
  principal: '^(?:[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}|GRP-[A-Z0-9-]{3,48})$'
  code_upper: '^[A-Z0-9][A-Z0-9_]{1,62}$'
  cost_center: '^CC-[0-9]{4,8}$'
  project_code: '^(PRJ|PRG)-[A-Z0-9]{2,4}-[0-9]{3,6}$'
  duration_iso: '^PT(?:[0-9]{1,3}H)?(?:[0-9]{1,3}M)?$|^P[0-9]{1,3}D$'

# =============================================================================
# TIER 1 - CORE MANDATORY ENTERPRISE TAGS
# Non-negotiable. Enforced by CI, by the compliance drift task, and by the
# pre-production promotion gate. 17 tags.
# =============================================================================
tags:

  - name: BUSINESS_UNIT
    tier: 1
    category: business
    description: >-
      Top-level legal/reporting entity accountable for the object. Anchors cost
      allocation, access boundaries and regulatory jurisdiction.
    value_source: reference_data
    reference_table: REF_BUSINESS_UNIT
    value_format: code_upper
    applies_to: [ACCOUNT, DATABASE, SCHEMA, TABLE, VIEW, MATERIALIZED_VIEW, DYNAMIC_TABLE, WAREHOUSE, STAGE, PIPE, TASK, STREAM, ROLE, NOTEBOOK, STREAMLIT, APPLICATION]
    default_requirement: INHERITED
    requirement:
      DATABASE: MANDATORY
      WAREHOUSE: MANDATORY
      COLUMN: NOT_APPLICABLE
    inheritance: inherit
    override_rule: any
    drives: [finops_chargeback, access_boundary, discovery, compliance_reporting]
    owner_role: EDGO
    version: "1.0.0"
    status: ACTIVE

  - name: DOMAIN
    tier: 1
    category: business
    description: >-
      Data Mesh domain that owns the object (e.g. CUSTOMER, FINANCE, SUPPLY_CHAIN).
      The unit of federated governance and of data-product publication.
    value_source: reference_data
    reference_table: REF_DOMAIN
    value_format: code_upper
    applies_to: [DATABASE, SCHEMA, TABLE, VIEW, MATERIALIZED_VIEW, DYNAMIC_TABLE, STAGE, PIPE, TASK, STREAM, WAREHOUSE, NOTEBOOK, STREAMLIT, APPLICATION]
    default_requirement: INHERITED
    requirement:
      DATABASE: MANDATORY
      SCHEMA: MANDATORY
      COLUMN: NOT_APPLICABLE
    inheritance: inherit
    override_rule: any
    drives: [data_mesh, discovery, federated_governance, finops_showback]
    owner_role: EDGO
    version: "1.0.0"
    status: ACTIVE

  - name: DATA_PRODUCT
    tier: 1
    category: business
    description: >-
      Named, versioned, independently consumable data product. In this framework
      a data product maps 1:1 to a schema (the publication boundary).
    value_source: reference_data
    reference_table: REF_DATA_PRODUCT
    value_format: '^[A-Z0-9][A-Z0-9_]{2,62}$'
    applies_to: [SCHEMA, TABLE, VIEW, MATERIALIZED_VIEW, DYNAMIC_TABLE, ICEBERG_TABLE, STAGE, PIPE, TASK, STREAM, SHARE, NOTEBOOK, STREAMLIT]
    default_requirement: INHERITED
    requirement:
      SCHEMA: MANDATORY
      SHARE: MANDATORY
      COLUMN: NOT_APPLICABLE
      DATABASE: NOT_APPLICABLE
    inheritance: inherit
    override_rule: none
    drives: [data_mesh, discovery, lineage, sla_management, finops_showback]
    owner_role: DOMAIN_COUNCIL
    version: "1.0.0"
    status: ACTIVE

  - name: DATA_OWNER
    tier: 1
    category: ownership
    description: >-
      Accountable business owner (RACI 'A') for the data. Named individual or
      enterprise group. Approves access, classification and retention decisions.
    value_source: free_text
    value_format: principal
    applies_to: [DATABASE, SCHEMA, TABLE, VIEW, MATERIALIZED_VIEW, DYNAMIC_TABLE, ICEBERG_TABLE, STAGE, SHARE, APPLICATION]
    default_requirement: INHERITED
    requirement:
      DATABASE: MANDATORY
      SCHEMA: MANDATORY
      COLUMN: NOT_APPLICABLE
    inheritance: inherit
    override_rule: any
    drives: [access_approval, incident_routing, attestation, discovery]
    owner_role: EDGO
    version: "1.0.0"
    status: ACTIVE

  - name: DATA_STEWARD
    tier: 1
    category: ownership
    description: >-
      Responsible steward (RACI 'R') executing day-to-day governance: tagging,
      classification review, quality remediation, metadata curation.
    value_source: free_text
    value_format: principal
    applies_to: [DATABASE, SCHEMA, TABLE, VIEW, MATERIALIZED_VIEW, DYNAMIC_TABLE, ICEBERG_TABLE, STAGE]
    default_requirement: INHERITED
    requirement:
      SCHEMA: MANDATORY
      COLUMN: NOT_APPLICABLE
    inheritance: inherit
    override_rule: any
    drives: [stewardship_workflow, attestation, remediation_routing]
    owner_role: EDGO
    version: "1.0.0"
    status: ACTIVE

  - name: SUPPORT_GROUP
    tier: 1
    category: ownership
    description: >-
      Operational on-call group that owns break/fix for the object. Must resolve
      to a real queue in the enterprise ITSM tool.
    value_source: reference_data
    reference_table: REF_SUPPORT_GROUP
    value_format: '^GRP-[A-Z0-9-]{3,48}$'
    applies_to: [DATABASE, SCHEMA, TABLE, VIEW, DYNAMIC_TABLE, STAGE, PIPE, TASK, STREAM, WAREHOUSE, APPLICATION]
    default_requirement: INHERITED
    requirement:
      DATABASE: MANDATORY
      TASK: MANDATORY
      PIPE: MANDATORY
      COLUMN: NOT_APPLICABLE
    inheritance: inherit
    override_rule: any
    drives: [incident_routing, sla_management, operational_reporting]
    owner_role: PLATFORM_ENGINEERING
    version: "1.0.0"
    status: ACTIVE

  - name: DATA_CLASSIFICATION
    tier: 1
    category: classification
    description: >-
      Enterprise confidentiality level. The primary driver of masking, sharing
      eligibility and export controls. Most restrictive value in the lineage wins.
    value_source: controlled_vocabulary
    allowed_values: [PUBLIC, INTERNAL, CONFIDENTIAL, RESTRICTED, HIGHLY_RESTRICTED]
    ordinal_values: [PUBLIC, INTERNAL, CONFIDENTIAL, RESTRICTED, HIGHLY_RESTRICTED]
    applies_to: [ACCOUNT, DATABASE, SCHEMA, TABLE, VIEW, MATERIALIZED_VIEW, DYNAMIC_TABLE, EXTERNAL_TABLE, ICEBERG_TABLE, COLUMN, STAGE, SHARE, NOTEBOOK, STREAMLIT]
    default_requirement: INHERITED
    requirement:
      DATABASE: MANDATORY
      SCHEMA: MANDATORY
      TABLE: MANDATORY
      VIEW: MANDATORY
      COLUMN: RECOMMENDED
      STAGE: MANDATORY
      SHARE: MANDATORY
    inheritance: inherit
    override_rule: more_restrictive_only
    drives: [dynamic_masking, sharing_control, export_control, compliance_reporting, discovery]
    owner_role: CISO_DATA_SECURITY
    version: "1.0.0"
    status: ACTIVE

  - name: PII
    tier: 1
    category: privacy
    description: >-
      Object contains Personally Identifiable Information as defined by the
      enterprise privacy standard. Set automatically at column level by the
      Snowflake classification reconciliation job; human-overridable with reason.
    value_source: controlled_vocabulary
    allowed_values: ["YES", "NO"]
    ordinal_values: ["NO", "YES"]
    applies_to: [DATABASE, SCHEMA, TABLE, VIEW, MATERIALIZED_VIEW, DYNAMIC_TABLE, EXTERNAL_TABLE, ICEBERG_TABLE, COLUMN, STAGE, SHARE]
    default_requirement: INHERITED
    requirement:
      TABLE: MANDATORY
      VIEW: MANDATORY
      COLUMN: MANDATORY
      SCHEMA: RECOMMENDED
      SHARE: MANDATORY
    inheritance: inherit
    override_rule: more_restrictive_only
    drives: [dynamic_masking, privacy_reporting, dsar_fulfilment, gdpr_ccpa_evidence, auto_classification]
    owner_role: PRIVACY_OFFICE
    version: "1.0.0"
    status: ACTIVE

  - name: ENVIRONMENT
    tier: 1
    category: lifecycle
    description: >-
      Deployment environment of the object. Never inherited across a clone into a
      different environment - the clone-remediation task rewrites it.
    value_source: controlled_vocabulary
    allowed_values: [DEV, TEST, UAT, PROD, SANDBOX, DR]
    applies_to: [ACCOUNT, DATABASE, SCHEMA, WAREHOUSE, STAGE, PIPE, TASK, STREAM, ROLE, INTEGRATION, NOTEBOOK, STREAMLIT, APPLICATION]
    default_requirement: INHERITED
    requirement:
      DATABASE: MANDATORY
      WAREHOUSE: MANDATORY
      COLUMN: NOT_APPLICABLE
    inheritance: inherit
    override_rule: none
    drives: [policy_selection, finops_chargeback, promotion_gate, masking_strictness]
    owner_role: PLATFORM_ENGINEERING
    version: "1.0.0"
    status: ACTIVE

  - name: DATA_LIFECYCLE
    tier: 1
    category: lifecycle
    description: >-
      Lifecycle state of the object itself. Drives deprecation comms, consumer
      warnings and the automated archive/purge pipeline.
    value_source: controlled_vocabulary
    allowed_values: [ACTIVE, DEPRECATED, ARCHIVED, PENDING_PURGE]
    applies_to: [DATABASE, SCHEMA, TABLE, VIEW, MATERIALIZED_VIEW, DYNAMIC_TABLE, ICEBERG_TABLE, STAGE, PIPE, TASK, STREAM, SHARE]
    default_requirement: INHERITED
    requirement:
      SCHEMA: MANDATORY
      TABLE: MANDATORY
      VIEW: MANDATORY
      COLUMN: NOT_APPLICABLE
    inheritance: inherit
    override_rule: any
    drives: [retirement_automation, consumer_notification, cost_avoidance, discovery]
    owner_role: EDGO
    version: "1.0.0"
    status: ACTIVE

  - name: CRITICALITY
    tier: 1
    category: lifecycle
    description: >-
      Business impact if the object is unavailable or incorrect. Drives DR scope,
      monitoring depth, change-control rigour and incident severity.
    value_source: controlled_vocabulary
    allowed_values: [LOW, MEDIUM, HIGH, CRITICAL]
    ordinal_values: [LOW, MEDIUM, HIGH, CRITICAL]
    applies_to: [DATABASE, SCHEMA, TABLE, VIEW, MATERIALIZED_VIEW, DYNAMIC_TABLE, PIPE, TASK, STREAM, WAREHOUSE, APPLICATION]
    default_requirement: INHERITED
    requirement:
      DATABASE: MANDATORY
      SCHEMA: MANDATORY
      COLUMN: NOT_APPLICABLE
    inheritance: inherit
    override_rule: more_restrictive_only
    drives: [dr_scope, monitoring_depth, change_control, incident_severity]
    owner_role: PLATFORM_ENGINEERING
    version: "1.0.0"
    status: ACTIVE

  - name: COST_CENTER
    tier: 1
    category: financial
    description: >-
      GL cost centre charged for the compute and storage attributed to the object.
      Must exist and be open in the ERP chart of accounts.
    value_source: reference_data
    reference_table: REF_COST_CENTER
    value_format: cost_center
    applies_to: [ACCOUNT, DATABASE, SCHEMA, WAREHOUSE, TASK, PIPE, NOTEBOOK, STREAMLIT, APPLICATION, ROLE, USER]
    default_requirement: INHERITED
    requirement:
      DATABASE: MANDATORY
      WAREHOUSE: MANDATORY
      COLUMN: NOT_APPLICABLE
    inheritance: inherit
    override_rule: any
    drives: [finops_chargeback, budget_enforcement, department_reporting]
    owner_role: FINANCE_FINOPS
    version: "1.0.0"
    status: ACTIVE

  - name: RETENTION_CLASS
    tier: 1
    category: compliance
    description: >-
      Records-management retention class from the enterprise retention schedule.
      Drives the automated archive/purge pipeline. LEGAL_HOLD always supersedes.
    value_source: controlled_vocabulary
    allowed_values: [TRANSIENT_30D, SHORT_1Y, STANDARD_3Y, EXTENDED_7Y, REGULATORY_10Y, PERMANENT, INDEFINITE_REVIEW]
    applies_to: [DATABASE, SCHEMA, TABLE, VIEW, MATERIALIZED_VIEW, DYNAMIC_TABLE, ICEBERG_TABLE, EXTERNAL_TABLE, STAGE]
    default_requirement: INHERITED
    requirement:
      SCHEMA: MANDATORY
      TABLE: MANDATORY
      STAGE: MANDATORY
      COLUMN: NOT_APPLICABLE
    inheritance: inherit
    override_rule: any
    drives: [retention_automation, purge_pipeline, compliance_reporting, storage_cost_control]
    owner_role: RECORDS_MANAGEMENT
    version: "1.0.0"
    status: ACTIVE

  - name: REGULATION
    tier: 1
    category: compliance
    description: >-
      The GOVERNING regulatory regime - the single regime whose controls are the
      most stringent for this object, resolved by documented precedence. The full
      multi-regime scope lives in CONTROL.REGULATORY_SCOPE (Snowflake tags are
      single-valued); see docs/02-tag-taxonomy.md#multi-valued-attributes.
    value_source: controlled_vocabulary
    allowed_values: [NONE, SOX, GDPR, CCPA, HIPAA, PCI_DSS, GLBA, FERPA, LGPD, PIPEDA, PDPA, MULTI]
    applies_to: [DATABASE, SCHEMA, TABLE, VIEW, MATERIALIZED_VIEW, DYNAMIC_TABLE, ICEBERG_TABLE, EXTERNAL_TABLE, COLUMN, STAGE, SHARE]
    default_requirement: INHERITED
    requirement:
      SCHEMA: MANDATORY
      TABLE: MANDATORY
      SHARE: MANDATORY
      COLUMN: OPTIONAL
    inheritance: inherit
    override_rule: any
    drives: [compliance_reporting, residency_control, audit_evidence, policy_selection]
    owner_role: COMPLIANCE_OFFICE
    version: "1.0.0"
    status: ACTIVE

  - name: MASKING_REQUIRED
    tier: 1
    category: security
    description: >-
      Declares that the column must carry a masking policy. This is the DECLARED
      INTENT; SNOWFLAKE.CORE tag-based masking attachment is the ENFORCEMENT.
      The drift detector reconciles the two and raises on divergence.
    value_source: controlled_vocabulary
    allowed_values: ["YES", "NO"]
    ordinal_values: ["NO", "YES"]
    applies_to: [TABLE, VIEW, MATERIALIZED_VIEW, DYNAMIC_TABLE, EXTERNAL_TABLE, ICEBERG_TABLE, COLUMN]
    default_requirement: OPTIONAL
    requirement:
      COLUMN: MANDATORY
      TABLE: RECOMMENDED
      VIEW: RECOMMENDED
    inheritance: inherit
    override_rule: more_restrictive_only
    drives: [dynamic_masking, control_attestation, drift_detection]
    owner_role: CISO_DATA_SECURITY
    version: "1.0.0"
    status: ACTIVE

  - name: ROW_ACCESS_REQUIRED
    tier: 1
    category: security
    description: >-
      Declares that the table/view must carry a row access policy. Snowflake does
      NOT support attaching row access policies to tags, so enforcement is via the
      SP_APPLY_ROW_ACCESS_POLICIES reconciliation task, not tag attachment.
    value_source: controlled_vocabulary
    allowed_values: ["YES", "NO"]
    ordinal_values: ["NO", "YES"]
    applies_to: [TABLE, VIEW, MATERIALIZED_VIEW, DYNAMIC_TABLE, EXTERNAL_TABLE, ICEBERG_TABLE]
    default_requirement: OPTIONAL
    requirement:
      TABLE: MANDATORY
      VIEW: MANDATORY
      COLUMN: NOT_APPLICABLE
    inheritance: inherit
    override_rule: more_restrictive_only
    drives: [row_access_policy, control_attestation, drift_detection]
    owner_role: CISO_DATA_SECURITY
    version: "1.0.0"
    status: ACTIVE

  - name: SLA_TIER
    tier: 1
    category: operational
    description: >-
      Freshness/availability commitment published to consumers of the data product.
      Drives monitoring thresholds, alert routing and DR tiering.
    value_source: controlled_vocabulary
    allowed_values: [PLATINUM_15M, GOLD_1H, SILVER_4H, BRONZE_24H, BEST_EFFORT]
    ordinal_values: [BEST_EFFORT, BRONZE_24H, SILVER_4H, GOLD_1H, PLATINUM_15M]
    applies_to: [SCHEMA, TABLE, VIEW, MATERIALIZED_VIEW, DYNAMIC_TABLE, PIPE, TASK, STREAM, SHARE]
    default_requirement: INHERITED
    requirement:
      SCHEMA: MANDATORY
      TASK: MANDATORY
      PIPE: MANDATORY
      COLUMN: NOT_APPLICABLE
    inheritance: inherit
    override_rule: any
    drives: [sla_management, monitoring_depth, alert_routing, dr_scope]
    owner_role: PLATFORM_ENGINEERING
    version: "1.0.0"
    status: ACTIVE

# =============================================================================
# TIER 2 - GOVERNANCE TAGS
# Mandatory only where a specific condition holds (conditional mandates, see
# `conditional_rules` below). Otherwise recommended. 14 tags.
# =============================================================================

  - name: SUB_DOMAIN
    tier: 2
    category: business
    description: Second-level decomposition of DOMAIN, for large domains only.
    value_source: reference_data
    reference_table: REF_SUB_DOMAIN
    value_format: code_upper
    applies_to: [SCHEMA, TABLE, VIEW, MATERIALIZED_VIEW, DYNAMIC_TABLE, TASK, PIPE, STREAM]
    default_requirement: OPTIONAL
    requirement:
      SCHEMA: RECOMMENDED
      COLUMN: NOT_APPLICABLE
    inheritance: inherit
    override_rule: any
    drives: [discovery, federated_governance, finops_showback]
    owner_role: DOMAIN_COUNCIL
    version: "1.0.0"
    status: ACTIVE

  - name: APPLICATION
    tier: 2
    category: business
    description: >-
      CMDB application identifier of the producing or consuming system. Enables
      impact analysis between Snowflake objects and the application portfolio.
    value_source: reference_data
    reference_table: REF_APPLICATION
    value_format: '^APP-[0-9]{4,8}$'
    applies_to: [DATABASE, SCHEMA, TABLE, VIEW, DYNAMIC_TABLE, STAGE, PIPE, TASK, STREAM, INTEGRATION, NOTEBOOK, STREAMLIT, APPLICATION]
    default_requirement: OPTIONAL
    requirement:
      SCHEMA: RECOMMENDED
      PIPE: RECOMMENDED
      INTEGRATION: RECOMMENDED
      COLUMN: NOT_APPLICABLE
    inheritance: inherit
    override_rule: any
    drives: [impact_analysis, cmdb_reconciliation, incident_routing]
    owner_role: ENTERPRISE_ARCHITECTURE
    version: "1.0.0"
    status: ACTIVE

  - name: APPLICATION_OWNER
    tier: 2
    category: ownership
    description: Accountable owner of the APPLICATION referenced by the object.
    value_source: free_text
    value_format: principal
    applies_to: [DATABASE, SCHEMA, STAGE, PIPE, TASK, INTEGRATION, APPLICATION]
    default_requirement: OPTIONAL
    requirement:
      APPLICATION: RECOMMENDED
      COLUMN: NOT_APPLICABLE
    inheritance: inherit
    override_rule: any
    drives: [impact_analysis, incident_routing, attestation]
    owner_role: ENTERPRISE_ARCHITECTURE
    version: "1.0.0"
    status: ACTIVE

  - name: PLATFORM_OWNER
    tier: 2
    category: ownership
    description: >-
      Platform engineering team accountable for the Snowflake infrastructure
      object (warehouse, integration, share, account-level construct).
    value_source: reference_data
    reference_table: REF_SUPPORT_GROUP
    value_format: '^GRP-[A-Z0-9-]{3,48}$'
    applies_to: [ACCOUNT, WAREHOUSE, INTEGRATION, SHARE, ROLE, DATABASE]
    default_requirement: OPTIONAL
    requirement:
      WAREHOUSE: MANDATORY
      INTEGRATION: MANDATORY
      COLUMN: NOT_APPLICABLE
    inheritance: inherit
    override_rule: any
    drives: [incident_routing, platform_attestation, finops_chargeback]
    owner_role: PLATFORM_ENGINEERING
    version: "1.0.0"
    status: ACTIVE

  - name: DOMAIN_OWNER
    tier: 2
    category: data_mesh
    description: >-
      Accountable owner of the mesh DOMAIN. Normally set once on the domain's
      database and inherited; a per-object override is an exception.
    value_source: free_text
    value_format: principal
    applies_to: [DATABASE, SCHEMA]
    default_requirement: OPTIONAL
    requirement:
      DATABASE: RECOMMENDED
