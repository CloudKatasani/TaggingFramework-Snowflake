# =============================================================================
# CONDITIONAL MANDATES
# A tag that is not universally mandatory but becomes mandatory when a predicate
# over other EFFECTIVE (lineage-resolved) tag values holds.
# =============================================================================
conditional_rules:
  - id: CR-001
    description: >-
      Any column carrying regulated data must declare masking intent, so that
      declared-versus-enforced drift is detectable for it.
    when: { data_classification_regulatory: [PII, SPII, PHI, PCI] }
    then_mandatory: [masking_required]
    object_types: [COLUMN]
    severity: CRITICAL

  - id: CR-002
    description: >-
      Cardholder data requires application-layer encryption in addition to
      Snowflake's transparent encryption at rest.
    when: { data_classification_regulatory: [PCI] }
    then_mandatory: [encryption_required]
    object_types: [TABLE, COLUMN, STAGE]
    severity: CRITICAL

  - id: CR-003
    description: >-
      RESTRICTED data must declare row-level access intent; confidentiality at
      this level is rarely satisfied by column masking alone.
    when: { data_classification_enterprise: [RESTRICTED] }
    then_mandatory: [row_access_required]
    object_types: [TABLE, VIEW, MATERIALIZED_VIEW, DYNAMIC_TABLE]
    severity: HIGH

  - id: CR-004
    description: >-
      Regulated data needs an accountable data owner and a retention class -
      without both, neither a DSAR nor a purge can be executed.
    when: { data_classification_regulatory: [PII, SPII, PHI, PCI] }
    then_mandatory: [data_owner, retention_class]
    object_types: [SCHEMA, TABLE, VIEW]
    severity: HIGH

  - id: CR-005
    description: >-
      Personal and health data must declare residency so replication and
      cross-region sharing can be evaluated before, not after, the fact.
    when: { data_classification_regulatory: [SPII, PHI, PCI] }
    then_mandatory: [data_residency]
    object_types: [DATABASE, SCHEMA, SHARE]
    severity: HIGH

  - id: CR-006
    description: Business-critical objects must publish RPO and RTO for DR planning.
    when: { criticality: [CRITICAL] }
    then_mandatory: [rpo, rto]
    object_types: [DATABASE, SCHEMA, TABLE]
    severity: MEDIUM

  - id: CR-007
    description: >-
      Data leaving the account always needs a named owner, a classification and
      an explicit distribution scope. There is no version of a share for which
      this is optional.
    when: { }
    then_mandatory: [sharing_scope, data_classification_enterprise, data_owner, data_product]
    object_types: [SHARE]
    severity: CRITICAL

  - id: CR-008
    description: >-
      Production workloads must name an on-call queue and an SLA commitment.
      An unroutable production incident is the failure this prevents.
    when: { environment: [PRD] }
    then_mandatory: [support_group, sla_tier]
    object_types: [SCHEMA, TASK, PIPE]
    severity: MEDIUM

  - id: CR-009
    description: >-
      Chargeback settlement posts a journal entry, which needs a GL cost centre
      code; `department` alone is not a posting key.
    when: { cost_allocation_model: [CHARGEBACK] }
    then_mandatory: [cost_center]
    object_types: [WAREHOUSE, DATABASE, SCHEMA]
    severity: MEDIUM

# =============================================================================
# CONTRADICTION RULES
# Pairs of tag values that cannot both be true. Unlike conditional mandates,
# these fire on a value being PRESENT AND WRONG rather than absent, and they are
# evaluated by SP_VALIDATE_COMPLIANCE check 7.
# =============================================================================
contradiction_rules:
  - id: XR-001
    description: >-
      Regulated data cannot be classified PUBLIC or NONE. This combination is
      almost always a table that was classified before its contents were
      understood, and it is the single most dangerous state in the estate: the
      masking policy reads the enterprise classification and lets the data
      through in clear.
    if_tag: data_classification_regulatory
    if_values: [PII, SPII, PHI, PCI]
    then_tag: data_classification_enterprise
    forbidden_values: [NONE, PUBLIC]
    severity: CRITICAL

  - id: XR-002
    description: >-
      RESTRICTED data cannot be shared beyond the enterprise. Caught before a
      listing is created rather than after it is discovered.
    if_tag: data_classification_enterprise
    if_values: [RESTRICTED]
    then_tag: sharing_scope
    forbidden_values: [PARTNER, PUBLIC_MARKETPLACE]
    severity: CRITICAL

  - id: XR-003
    description: >-
      Cardholder data must never sit in a training environment. PCI-DSS scope
      follows the data, and a TRAINING account is not in the assessed CDE.
    if_tag: data_classification_regulatory
    if_values: [PCI]
    then_tag: environment
    forbidden_values: [TRAINING, DEV]
    severity: CRITICAL

  - id: XR-004
    description: >-
      A deprecated or archived object cannot carry a live SLA commitment;
      consumers reading the catalogue would plan against a promise nobody holds.
    if_tag: data_lifecycle
    if_values: [DEPRECATED, ARCHIVED, PENDING_PURGE]
    then_tag: sla_tier
    forbidden_values: [PLATINUM_15M, GOLD_1H]
    severity: MEDIUM

# =============================================================================
# CONFLICT RESOLUTION
# =============================================================================
# data_classification_regulatory holds ONE value. Real columns are frequently in
# several categories at once - a payments record can be PII and PCI together.
# The tag carries the GOVERNING category by this precedence (index 0 highest),
# and CONTROL.REGULATORY_SCOPE carries the complete set.
#
# Ordered by how prescriptive the mandated technical control is, not by penalty
# size: satisfying PCI-DSS field handling also satisfies a privacy regime's
# data-minimisation expectation, but not the reverse.
regulatory_category_precedence: [PCI, PHI, SPII, PII, NONE]

# The regulatory REGIME tag resolves the same way.
regulation_precedence: [HIPAA, PCI_DSS, NERC_CIP, GLBA, SOX, GDPR, CCPA, FERPA, NONE]

# Inheritance resolution order for the EFFECTIVE tag value. First non-null wins,
# except where override_rule = more_restrictive_only, in which case the most
# restrictive value anywhere in the lineage wins regardless of depth.
inheritance_precedence: [COLUMN, TABLE, SCHEMA, DATABASE, ACCOUNT]

# =============================================================================
# TAG -> POLICY BINDINGS
# =============================================================================
masking_bindings:
  # ONE binding, by design.
  #
  # Snowflake attaches at most one masking policy per data type per tag, and a
  # column can only ever be protected by one masking policy. If both
  # classification tags carried policies, a column tagged RESTRICTED and PCI
  # would have two candidates for the same data type and the winner would depend
  # on tag-lineage proximity rather than on which control is stronger. That is an
  # unacceptable property for a privacy control.
  #
  # So policies bind to data_classification_enterprise only - it is mandatory on
  # every table and view, so lineage carries it to every column of a matching
  # type - and the body branches on data_classification_regulatory.
  - tag: data_classification_enterprise
    policy_prefix: MP_ENTERPRISE
    data_types: [STRING, NUMBER, DATE, TIMESTAMP_NTZ, VARIANT]
    # Tags the policy body reads at run time. Each MUST be at least RECOMMENDED
    # on COLUMN or the branch silently never fires and the control degrades with
    # no error anywhere. Enforced by validate_catalog.py.
    policy_reads_tags: [data_classification_regulatory, masking_required]
    note: >-
      Bound to data_classification_enterprise only.
      data_classification_regulatory deliberately carries no attachment of its
      own - it is read inside the policy body.

row_access_bindings:
  - tag: row_access_required
    value: "YES"
    policy: RAP_OPERATING_COMPANY_SCOPE
    applies_to: [TABLE, VIEW, MATERIALIZED_VIEW, DYNAMIC_TABLE]
    mapping_table: CONTROL.ROW_ACCESS_ENTITLEMENT
    note: >-
      Applied by a reconciliation task, not by tag attachment, because Snowflake
      does not support attaching row access policies to tags. The policy binds to
      the table's own OPERATING_COMPANY column; a table declaring the tag without
      that column is reported as CRITICAL rather than skipped.

# =============================================================================
# LIFECYCLE
# =============================================================================
lifecycle:
  states: [PROPOSED, APPROVED, ACTIVE, DEPRECATED, RETIRED]
  deprecation_notice_days: 90
  retirement_grace_days: 180
  approval_quorum: "2 of 3 Data Governance Council members, CISO for security/privacy tags"
  review_cadence_days: 90
