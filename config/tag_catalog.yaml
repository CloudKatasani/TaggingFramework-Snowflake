# =============================================================================
# CONDITIONAL MANDATES
# A tag that is not universally mandatory but becomes mandatory when a predicate
# over other effective tag values holds. Evaluated by SP_VALIDATE_COMPLIANCE
# against the EFFECTIVE (lineage-resolved) tag values, not just direct ones.
# =============================================================================
conditional_rules:
  - id: CR-001
    description: HIPAA-regulated objects must declare PHI status at column level.
    when: { REGULATION: [HIPAA, MULTI] }
    then_mandatory: [PHI]
    object_types: [TABLE, VIEW, COLUMN]
    severity: HIGH

  - id: CR-002
    description: PCI-DSS-regulated objects must declare PCI status at column level.
    when: { REGULATION: [PCI_DSS, MULTI] }
    then_mandatory: [PCI]
    object_types: [TABLE, VIEW, COLUMN]
    severity: CRITICAL

  - id: CR-003
    description: >-
      RESTRICTED and HIGHLY_RESTRICTED data must declare row-level access intent.
    when: { DATA_CLASSIFICATION: [RESTRICTED, HIGHLY_RESTRICTED] }
    then_mandatory: [ROW_ACCESS_REQUIRED]
    object_types: [TABLE, VIEW, MATERIALIZED_VIEW, DYNAMIC_TABLE]
    severity: HIGH

  - id: CR-004
    description: PII columns must declare masking intent.
    when: { PII: ["YES"] }
    then_mandatory: [MASKING_REQUIRED]
    object_types: [COLUMN]
    severity: CRITICAL

  - id: CR-005
    description: >-
      Objects subject to GDPR/CCPA/LGPD must declare data residency so replication
      and cross-region sharing can be evaluated.
    when: { REGULATION: [GDPR, CCPA, LGPD, MULTI] }
    then_mandatory: [DATA_RESIDENCY]
    object_types: [DATABASE, SCHEMA, SHARE]
    severity: HIGH

  - id: CR-006
    description: CRITICAL objects must publish RPO and RTO for DR planning.
    when: { CRITICALITY: [CRITICAL] }
    then_mandatory: [RPO, RTO]
    object_types: [DATABASE, SCHEMA, TABLE]
    severity: MEDIUM

  - id: CR-007
    description: Anything leaving the account must declare its permitted distribution.
    when: { }
    then_mandatory: [SHARING_SCOPE, DATA_CLASSIFICATION, DATA_PRODUCT_OWNER]
    object_types: [SHARE]
    severity: CRITICAL

  - id: CR-008
    description: Project-funded workloads must carry the funding programme.
    when: { COST_ALLOCATION_MODEL: [CHARGEBACK] }
    then_mandatory: [COST_CENTER]
    object_types: [WAREHOUSE, DATABASE]
    severity: MEDIUM

# =============================================================================
# CONFLICT RESOLUTION
# =============================================================================
# Snowflake tags are single-valued per object. REGULATION therefore carries the
# GOVERNING regime, resolved by this precedence (index 0 = highest). The full
# multi-regime set is held in CONTROL.REGULATORY_SCOPE and surfaced by
# REPORTING.VW_REGULATORY_SCOPE. When two or more regimes apply, the tag is set
# to MULTI and the scope table is authoritative.
regulation_precedence: [HIPAA, PCI_DSS, GLBA, SOX, GDPR, LGPD, PIPEDA, PDPA, CCPA, FERPA, NONE]

# Inheritance resolution order for EFFECTIVE tag value. First non-null wins,
# except where override_rule = more_restrictive_only, in which case the most
# restrictive value found anywhere in the lineage wins regardless of depth.
inheritance_precedence: [COLUMN, TABLE, SCHEMA, DATABASE, ACCOUNT]

# =============================================================================
# TAG -> POLICY BINDINGS
# Snowflake supports TAG-BASED MASKING POLICIES (ALTER TAG ... SET MASKING POLICY)
# with at most ONE policy per data type per tag. It does NOT support tag-based
# ROW ACCESS policies - those are reconciled by SP_APPLY_ROW_ACCESS_POLICIES.
# =============================================================================
masking_bindings:
  # ONE binding, by design.
  #
  # Snowflake attaches at most one masking policy per data type per tag, and a
  # column can only ever be protected by one masking policy. If PII, PHI, PCI and
  # DATA_CLASSIFICATION each carried their own policy, a column tagged both PII
  # and RESTRICTED would have two candidate policies for the same data type and
  # the winner would depend on tag-lineage proximity rather than on risk. That is
  # an unacceptable property for a privacy control.
  #
  # So the framework binds policies to exactly ONE tag - DATA_CLASSIFICATION,
  # which is MANDATORY on every table and view and therefore propagates to every
  # column of a matching type through tag lineage - and the policy body branches
  # on the other signals via SYSTEM$GET_TAG_ON_CURRENT_COLUMN. Result: five
  # policies instead of fifteen, deterministic resolution, and adding a new
  # privacy signal changes a policy body rather than the attachment graph.
  - tag: DATA_CLASSIFICATION
    policy_prefix: MP_ENTERPRISE
    data_types: [STRING, NUMBER, DATE, TIMESTAMP_NTZ, VARIANT]
    # Tags the policy body reads at run time. Every one of these MUST be at least
    # RECOMMENDED on COLUMN, otherwise the branch silently never fires and the
    # control degrades without any error. Enforced by validate_catalog.py.
    policy_reads_tags: [PII, PHI, PCI, SENSITIVE_DATA, MASKING_REQUIRED]
    note: >-
      Bound to DATA_CLASSIFICATION only. PII/PHI/PCI deliberately carry NO
      policy attachment of their own - they are read inside the policy body.

row_access_bindings:
  - tag: ROW_ACCESS_REQUIRED
    value: "YES"
    policy: RAP_BUSINESS_UNIT_SCOPE
    applies_to: [TABLE, VIEW, MATERIALIZED_VIEW, DYNAMIC_TABLE]
    mapping_table: CONTROL.ROW_ACCESS_ENTITLEMENT
    note: >-
      Applied by reconciliation task, not by tag attachment. The policy signature
      is resolved from the table's own BUSINESS_UNIT column if present, else the
      table is registered in CONTROL.ROW_ACCESS_EXCEPTION for manual binding.

# =============================================================================
# LIFECYCLE
# =============================================================================
lifecycle:
  states: [PROPOSED, APPROVED, ACTIVE, DEPRECATED, RETIRED]
  deprecation_notice_days: 90
  retirement_grace_days: 180
  approval_quorum: "2 of 3 Data Governance Council members, CISO for security/privacy tags"
  review_cadence_days: 90
