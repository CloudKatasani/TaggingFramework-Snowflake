name: Tag Framework

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------------------
  # Gate 1 - the catalog itself. Runs first and fast: nothing else is meaningful
  # if the taxonomy is malformed.
  # ---------------------------------------------------------------------------
  validate-catalog:
    name: Validate tag catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install --quiet pyyaml
      - name: Validate catalog structure and governance rules
        run: cd scripts && python validate_catalog.py

  # ---------------------------------------------------------------------------
  # Gate 2 - generated artifacts must match the catalog.
  # This is what makes it impossible for the published matrix and the deployed
  # tags to diverge (docs/09-anti-patterns.md AP-10).
  # ---------------------------------------------------------------------------
  generated-sync:
    name: Generated artifacts are current
    runs-on: ubuntu-latest
    needs: validate-catalog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install --quiet pyyaml
      - name: Check generated SQL, docs and tfvars
        run: |
          cd scripts
          python generate_sql.py   --check
          python generate_docs.py  --check
          python generate_tfvars.py --check
      - name: Explain the failure
        if: failure()
        run: |
          echo "::error::Generated artifacts are stale."
          echo "Run 'make build' locally and commit the regenerated files."

  # ---------------------------------------------------------------------------
  # Gate 3 - destructive SQL. Each rule here corresponds to a way a control has
  # been silently removed from a production Snowflake account.
  # ---------------------------------------------------------------------------
  lint-sql:
    name: Lint SQL for destructive patterns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install --quiet pyyaml
      - name: Lint
        run: cd scripts && python lint_sql.py
      - name: Explain the failure
        if: failure()
        run: |
          echo "::error::Unsafe SQL detected."
          echo "CREATE OR REPLACE TAG and DROP TAG remove every assignment of"
          echo "the tag across the account, silently. See docs/09-anti-patterns.md AP-05."

  # ---------------------------------------------------------------------------
  # Gate 4 - unit tests over the catalog semantics and the generators.
  # ---------------------------------------------------------------------------
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: validate-catalog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install --quiet pyyaml pytest
      - run: python -m pytest tests -q

  # ---------------------------------------------------------------------------
  # Gate 5 - Terraform. Format and validate only; no credentials are needed and
  # none are provided to pull-request runs.
  # ---------------------------------------------------------------------------
  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    needs: generated-sync
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Format check
        run: terraform fmt -check -recursive terraform/
      - name: Validate module
        run: |
          cd terraform/envs/prod
          terraform init -backend=false
          terraform validate

  # ---------------------------------------------------------------------------
  # Deployment plan against non-production. Runs only on main, and only with an
  # environment approval, because it authenticates to a Snowflake account.
  # ---------------------------------------------------------------------------
  plan-nonprod:
    name: Plan against non-production
    runs-on: ubuntu-latest
    needs: [generated-sync, lint-sql, test, terraform]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: nonprod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install --quiet pyyaml
      - name: Print deployment order
        run: cd scripts && python deploy.py --plan
      # Add the Snowflake CLI step here once an account is wired up:
      #   - uses: snowflakedb/snowflake-cli-action@v1
      #   - run: cd scripts && python deploy.py --execute nonprod
      # Credentials belong in the `nonprod` environment's secrets, never in the
      # repository.
